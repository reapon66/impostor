<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Jogo do Impostor</title>
    <style>
        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* =========================
   VARIÁVEIS (DESKTOP – MÉDIO)
   ========================= */
        :root {
            --max-width: 50vw;
            /* CARD */
            --card-padding-y: 1.375rem;
            /* 22px */
            --card-padding-x: 1.125rem;
            /* 18px */
            --card-radius: 1rem;
            /* 16px */

            /* TÍTULOS */
            --h1-size: 1.75rem;
            /* 22px */
            --h2-size: 1.5rem;
            /* 18px */
            --h3-size: 1.25rem;
            /* 16px */

            /* TEXTO */
            --text-size: 1rem;
            /* 14px */
            --label-size: 0.875rem;
            /* 13px */

            /* INPUTS / BOTÕES */
            --input-padding: 0.625rem;
            /* 10px */
            --input-font: 0.875rem;
            /* 14px */
            --button-padding: 0.75rem;
            /* 12px */
            --button-font: 0.875rem;
            /* 14px */

            --primary-color: #9b3dff;
            --primary-gradient: linear-gradient(135deg, #7a1cff 0%, #6e00b3 100%);
        }

        /* =========================
   MOBILE – GRANDE
   ========================= */
        @media (max-width: 1000px) {
            :root {
                --max-width: 90vw;

                --card-padding-y: 1.75rem;
                /* 28px */
                --card-padding-x: 1.375rem;
                /* 22px */
                --card-radius: 1.25rem;
                /* 20px */

                --h1-size: 5rem;
                /* 26px */
                --h2-size: 6rem;
                /* 22px */
                --h3-size: 4rem;
                /* 18px */

                --text-size: 3rem;
                /* 16px */
                --label-size: 2.8rem;
                /* 15px */

                --input-padding: 0.875rem;
                /* 14px */
                --input-font: 2.8rem;
                /* 16px */
                --button-padding: 1rem;
                /* 16px */
                --button-font: 2.8rem;
                /* 16px */
            }

            /* HOVER */
            .categoria-box label:hover {
                background: rgba(40, 0, 80, 0.55);
            }
        }

        /* BODY */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #3d007a, #6e00b3, #9b3dff);
            background-attachment: fixed;
            color: #f2eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* APP */
        #app {
            width: var(--max-width);
        }

        /* CARD */
        .card {
            background: rgba(20, 0, 40, 0.75);
            padding: var(--card-padding-y) var(--card-padding-x);
            border-radius: var(--card-radius);
            backdrop-filter: blur(6px);
            box-shadow: 0 0.375rem 1.25rem rgba(0, 0, 0, 0.45);
            text-align: center;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(0.625rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* TÍTULOS */
        h1 {
            font-size: var(--h1-size);
            font-weight: 700;
            color: #e8d4ff;
            margin-bottom: 0.875rem;
        }

        h2 {
            font-size: var(--h2-size);
            font-weight: 600;
            color: #e8d4ff;
            margin-bottom: 0.625rem;
        }

        h3 {
            font-size: var(--h3-size);
            font-weight: 600;
            color: #d9c2ff;
            margin-bottom: 0.5rem;
        }

        /* TEXTO */
        p {
            font-size: var(--text-size);
            color: #e7d9ff;
            line-height: 1.4;
            margin-bottom: 0.625rem;
        }

        b {
            color: #ffffff;
        }

        /* LABEL */
        label {
            display: block;
            margin-top: 0.75rem;
            margin-bottom: 0.375rem;
            font-weight: 600;
            color: #e4cfff;
            font-size: var(--label-size);
        }

        /* INPUTS */
        input,
        select {
            width: 100%;
            padding: var(--input-padding);
            border-radius: 0.375rem;
            border: 1px solid #5d2b91;
            background: #1a0033;
            color: #f2eaff;
            font-size: var(--input-font);
            text-align: center;
            transition: all 0.2s ease;
            margin-bottom: 0.625rem;
        }

        input::placeholder {
            color: #bfa6e6;
        }

        input:focus,
        select:focus {
            border-color: #b37aff;
            background: #26004f;
            outline: none;
        }

        /* CATEGORIAS */
        #categoriaList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.625rem;
        }

        /* ESCONDE CHECKBOX */
        .categoria-box input[type="checkbox"] {
            appearance: none;
            width: 0;
            height: 0;
            display: none;
        }

        .categoria-box:has(input:checked) label,
        .categoria-box input:checked+label {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transform: translateY(-2px);
            font-weight: bold;
            color: #fff;
        }

        /* BOTÃO DA CATEGORIA */
        .categoria-box label {
            cursor: pointer;
            padding: 0.5rem 0.875rem;
            border-radius: 1.125rem;
            background: rgba(40, 0, 80, 0.55);
            border: 1px solid #5d2b91;
            color: #e7d9ff;
            font-size: var(--label-size);
            transition: all 0.2s ease;
            user-select: none;
        }

        /* HOVER */
        .categoria-box label:hover {
            background: rgba(80, 0, 140, 0.7);
        }



        /* BOTÕES */
        button {
            width: 100%;
            margin-top: 1.25rem;
            padding: var(--button-padding);
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            background: #7a1cff;
            color: #fff;
            font-weight: 600;
            font-size: var(--button-font);
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #9d4bff;
            transform: scale(1.04);
        }

        button:active {
            transform: scale(0.97);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 0.375rem;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(180, 140, 255, 0.4);
            border-radius: 0.25rem;
        }
    </style>
</head>

        let totalPlayers = 0;

        let impostorIndex = 0;
        let palavraEscolhida = "";
        let indexAtual = 0;
        let primeiroASpeak = 0;

        // ===========================
        // TELA INICIAL
        // ===========================
        function telaInicial() {
            const memoria = carregarMemoria();


            app.innerHTML = `
        <div class=" card inicio">
            <h1>Impostor da oficina da torta</h1>

            <h3 style="margin-top:20px">Quantidade de jogadores:</h3>
            <input type="number" id="numPlayers" min="3"  value="${memoria.qtd || 5}" oninput="gerarInputsJogadores()">

            <h3 style="margin-top:20px">Nomes dos jogadores:</h3>
            <div id="playerNames"></div>

            <h3 style="margin-top:20px">Quantidade de impostores</h3>
            <select id="numimpostores">
                <option value="1" ${memoria.numImpostores == 1 ? "selected" : ""}>1</option>
                <option value="2" ${memoria.numImpostores == 2 ? "selected" : ""}>2</option>
            </select>
            

            <h3 style="margin-top:30px">Escolha as categorias:</h3>
            <div id="categoriaList">
                ${Object.keys(categorias).map(cat => `
                    <div class="categoria-box">
                        <label>
                            <input type="checkbox" value="${cat}" ${memoria.categorias.includes(cat) ? "checked" : ""}>
                            ${cat}
                        </label>
                    </div>
                `).join("")}
            </div>

            <button onclick="iniciarJogo()">Começar</button>
        </div>
    `;

            gerarInputsJogadores(memoria.nomes);
        }

        // ===========================
        // GERAR INPUTS DE NOMES
        // ===========================
        function gerarInputsJogadores(nomesSalvos = []) {
            const qtd = parseInt(document.getElementById("numPlayers").value);
            const box = document.getElementById("playerNames");


            if (!qtd || qtd < 1) return;

            box.innerHTML = "";

            for (let i = 1; i <= qtd; i++) {
                const nomeSalvo = nomesSalvos[i - 1] || "";
                box.innerHTML += `
            <input class="player-input" id="playerName${i}" value="${nomeSalvo}" placeholder="Nome do jogador ${i}">
        `;
            }
        }

        // ===========================
        // SALVAR NO LOCALSTORAGE
        // ===========================
        function salvarMemoria(qtd, nomes, categoriasMarcadas, numImpostores) {
            localStorage.setItem("jogoImpostor", JSON.stringify({
                qtd,
                nomes,
                categorias: categoriasMarcadas,
                numImpostores
            }));
        }

        function carregarMemoria() {
            const dados = localStorage.getItem("jogoImpostor");
            if (!dados) {
                return {
                    qtd: 5,
                    nomes: [],
                    categorias: Object.keys(categorias),
                    numImpostores: 1
                };
            }

            const parsed = JSON.parse(dados);

            return {
                qtd: parsed.qtd ?? 5,
                nomes: parsed.nomes ?? [],
                categorias: parsed.categorias ?? Object.keys(categorias),
                numImpostores: parsed.numImpostores ?? 1
            };
        }

        // ===========================
        // INICIAR JOGO
        // ===========================
        function iniciarJogo() {
            totalPlayers = parseInt(document.getElementById("numPlayers").value);
            numImpostores = Number(document.getElementById("numimpostores").value);


            if (isNaN(totalPlayers) || totalPlayers < 3) {
                alert("Mínimo de 3 jogadores!");
                return;
            }

            // Categorias
            const selecionadas = [...document.querySelectorAll("#categoriaList input:checked")]
                .map(c => c.value);

            if (selecionadas.length === 0) {
                alert("Selecione pelo menos 1 categoria!");
                return;
            }

            // Palavras da categoria
            let pool = [];
            selecionadas.forEach(cat => {
                pool = pool.concat(categorias[cat]);
            });

            palavraEscolhida = pool[Math.floor(Math.random() * pool.length)];

            // Nomes dos jogadores
            players = [];
            let nomes = [];

            for (let i = 1; i <= totalPlayers; i++) {
                let nome = document.getElementById(`playerName${i}`).value.trim();
                if (!nome) nome = "Player " + i;

                nomes.push(nome);
                players.push({ id: i, nome, impostor: false });
            }

            // SALVAR NA MEMÓRIA
            salvarMemoria(totalPlayers, nomes, selecionadas, numImpostores);

            // Sorteio do impostor
            impostoresRestantes = numImpostores;
            while (impostoresRestantes > 0) {
                impostoresRestantes--;

                impostorIndex = Math.floor(Math.random() * totalPlayers);
                players[impostorIndex].impostor = true;
            }

            indexAtual = 0;

            mostrarPlayerTelaSegura();
        }

        // ===========================
        // TELA DE SEGURANÇA
        // ===========================
        function mostrarPlayerTelaSegura() {
            const p = players[indexAtual];

            app.innerHTML = `
        <div class="card">
            <h2>${p.nome}</h2>
            <p>Clique para revelar seu papel.</p>

            <button onclick="revelarPapel()">Revelar</button>
        </div>
    `;
        }

        // ===========================
        // REVELAR PAPEL
        // ===========================
        function revelarPapel() {
            const p = players[indexAtual];

            app.innerHTML = `
        <div class="card">
            <h2>${p.nome}</h2>
            ${p.impostor
                    ? `<p>Você é o <b style="color: var(--primary-color);">IMPOSTOR</b>.</p>`
                    : `<p>Sua palavra é:<br><br><b>${palavraEscolhida}</b></p>`
                }
            <button onclick="proximoPlayer()">OK, já vi</button>
        </div>
    `;
        }

        // ===========================
        // PRÓXIMO PLAYER
        // ===========================
        function proximoPlayer() {
            indexAtual++;
            if (indexAtual < players.length) {
                mostrarPlayerTelaSegura();
            } else {
                escolherQuemComenca();
            }
        }

        // ===========================
        // QUEM COMEÇA?
        // ===========================
        function escolherQuemComenca() {
            const chanceImpostor = 0.05;
            const chanceProxImpostor = 0.33;
            if (Math.random() < chanceImpostor) {
                primeiroASpeak = impostorIndex;
            }
            else if (Math.random() < chanceProxImpostor) {
                if (players.length == impostorIndex) {
                    primeiroASpeak = 0;
                }
                else {
                    primeiroASpeak = impostorIndex + 1;
                }
            }
            else {
                const normais = players.filter(p => !p.impostor);
                const escolha = Math.floor(Math.random() * normais.length);
                primeiroASpeak = players.findIndex(p => p.id === normais[escolha].id);
            }

            telaInicioDiscussao();
        }

        // ===========================
        // TELA FINAL
        // ===========================
        function telaInicioDiscussao() {
            const p = players[primeiroASpeak];

            app.innerHTML = `
        <div class="card">
            <h1>Papéis revelados!</h1>
            <p>Quem começa falando:</p>

            <h2 style=" margin-top:20px;">
                ${p.nome}
            </h2>

            <button onclick="telaInicial()">Jogar de novo</button>
        </div>
    `;
        }

        telaInicial();
    </script>
