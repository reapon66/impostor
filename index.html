        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           TOKENS (mobile-first, fluidos via clamp — sem breakpoint quebrando fonte)
           ========================= */
        :root {
            --card-padding-y: clamp(1.25rem, 3vw + .5rem, 1.75rem);
            --card-padding-x: clamp(1rem, 3vw + .4rem, 1.375rem);
            --card-radius: 1.25rem;

            --h1-size: clamp(1.4rem, 4vw + .9rem, 1.9rem);
            --h2-size: clamp(1.2rem, 3vw + .8rem, 1.5rem);
            --h3-size: clamp(1rem, 2vw + .7rem, 1.2rem);

            --text-size: clamp(.95rem, 1.4vw + .7rem, 1.05rem);
            --label-size: clamp(.85rem, 1.2vw + .65rem, .95rem);

            --input-padding: .75rem;
            --input-font: 1rem;
            /* fixo em 16px pra não dar zoom automático no iOS */
            --button-padding: .875rem;
            --button-font: clamp(.95rem, 1.4vw + .7rem, 1.05rem);

            --touch-target: 44px;
            /* alvo de toque mínimo recomendado */
            color-scheme: dark;
        }

        /* =========================
           TEMA "ROXO" (padrão / original)
           ========================= */
        :root,
        [data-theme="purple"] {
            --bg-gradient: linear-gradient(135deg, #3d007a, #6e00b3, #9b3dff);
            --card-bg: rgba(20, 0, 40, .78);
            --text-primary: #f2eaff;
            --text-heading: #e8d4ff;
            --text-heading-2: #d9c2ff;
            --text-muted: #bfa6e6;
            --accent: #9b3dff;
            --accent-strong: #7a1cff;
            --accent-gradient: linear-gradient(135deg, #7a1cff 0%, #6e00b3 100%);
            --input-bg: #1a0033;
            --input-border: #5d2b91;
            --input-focus-bg: #26004f;
            --input-focus-border: #b37aff;
            --chip-bg: rgba(40, 0, 80, .55);
            --chip-bg-hover: rgba(80, 0, 140, .7);
            --chip-border: #5d2b91;
            --danger: #ff6b81;
            --scrollbar-thumb: rgba(180, 140, 255, .45);
        }

        /* =========================
           TEMA "ESCURO" (novo — quase preto, OLED friendly)
           ========================= */
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(ellipse at top, #1a1625 0%, #0a0810 55%, #050308 100%);
            --card-bg: rgba(17, 15, 22, .85);
            --text-primary: #e9e6f2;
            --text-heading: #d6c9f2;
            --text-heading-2: #c3b3e0;
            --text-muted: #8d84a3;
            --accent: #8b5cf6;
            --accent-strong: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --input-bg: #131019;
            --input-border: #2c2438;
            --input-focus-bg: #1b1626;
            --input-focus-border: #8b5cf6;
            --chip-bg: rgba(30, 26, 38, .7);
            --chip-bg-hover: rgba(45, 38, 58, .85);
            --chip-border: #2c2438;
            --danger: #ff6b81;
            --scrollbar-thumb: rgba(139, 92, 246, .4);
        }

        html {
            height: 100%;
        }

        /* BODY */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            transition: background .4s ease;
        }

        /* APP — mobile-first: 100% da largura útil, com teto pra desktop */
        #app {
            width: 100%;
            max-width: 480px;
            margin-top: 3rem;
            /* espaço reservado pros botões flutuantes */
            margin-bottom: .5rem;
        }

        /* CARD */
        .card {
            width: 100%;
            background: var(--card-bg);
            padding: var(--card-padding-y) var(--card-padding-x);
            border-radius: var(--card-radius);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
            text-align: center;
            animation: fadeIn .35s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(.625rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* TÍTULOS */
        h1 {
            font-size: var(--h1-size);
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: .75rem;
            line-height: 1.2;
        }

        h2 {
            font-size: var(--h2-size);
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: .6rem;
        }

        h3 {
            font-size: var(--h3-size);
            font-weight: 600;
            color: var(--text-heading-2);
            margin-bottom: .5rem;
        }

        /* TEXTO */
        p {
            font-size: var(--text-size);
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: .6rem;
        }

        b {
            color: #ffffff;
        }

        /* LABEL */
        label {
            display: block;
            margin-top: .75rem;
            margin-bottom: .375rem;
            font-weight: 600;
            color: var(--text-heading-2);
            font-size: var(--label-size);
        }

        /* INPUTS */
        input,
        select {
            width: 100%;
            min-height: var(--touch-target);
            padding: var(--input-padding);
            border-radius: .6rem;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: var(--input-font);
            text-align: center;
            transition: all .2s ease;
            margin-bottom: .625rem;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus,
        select:focus {
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
            outline: none;
        }

        /* CATEGORIAS */
        #categoriaList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .5rem;
            margin-top: .625rem;
        }

        .categoria-box input[type="checkbox"] {
            appearance: none;
            width: 0;
            height: 0;
            display: none;
        }

        .categoria-box:has(input:checked) label,
        .categoria-box input:checked+label {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(124, 58, 237, .4);
            transform: translateY(-2px);
            font-weight: bold;
            color: #fff;
        }

        .categoria-box label {
            cursor: pointer;
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
            padding: .5rem 1rem;
            border-radius: 999px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--text-primary);
            font-size: var(--label-size);
            transition: all .2s ease;
            user-select: none;
        }

        @media (hover: hover) {
            .categoria-box label:hover {
                background: var(--chip-bg-hover);
            }
        }

        /* BOTÕES */
        button {
            width: 100%;
            min-height: var(--touch-target);
            margin-top: 1.25rem;
            padding: var(--button-padding);
            border-radius: .6rem;
            border: none;
            cursor: pointer;
            background: var(--accent-strong);
            color: #fff;
            font-weight: 600;
            font-size: var(--button-font);
            transition: background .2s ease, transform .1s ease, opacity .2s ease;
        }

        @media (hover: hover) {
            button:hover:not(:disabled) {
                background: var(--accent);
                transform: scale(1.03);
            }
        }

        button:active:not(:disabled) {
            transform: scale(.97);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--input-focus-border);
            outline-offset: 2px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--chip-border);
            color: var(--text-primary);
        }

        @media (hover: hover) {
            .btn-secondary:hover {
                background: var(--chip-bg);
            }
        }

        /* CONTROLES FLUTUANTES (tema / configurações) */
        .floating-controls {
            position: fixed;
            top: max(.75rem, env(safe-area-inset-top));
            right: max(.75rem, env(safe-area-inset-right));
            display: flex;
            gap: .5rem;
            z-index: 60;
        }

        .icon-btn {
            width: 2.5rem;
            height: 2.5rem;
            min-height: 0;
            margin: 0;
            border-radius: 50%;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            padding: 0;
            backdrop-filter: blur(8px);
            line-height: 1;
        }

        @media (hover: hover) {
            .icon-btn:hover {
                background: var(--chip-bg-hover);
                transform: none;
            }
        }

        /* MODAL DE CONFIGURAÇÕES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 100;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-card {
            width: min(420px, 100%);
            max-height: 85dvh;
            overflow-y: auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--chip-border);
            border-radius: 1.1rem;
            padding: 1.5rem;
            text-align: left;
            animation: fadeIn .25s ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .modal-card h2 {
            text-align: center;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        /* SWITCH (toggle) */
        .switch {
            position: relative;
            display: inline-block;
            width: 3rem;
            height: 1.7rem;
            flex: 0 0 auto;
        }

        .switch input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            cursor: pointer;
            z-index: 2;
        }

        .switch-track {
            position: absolute;
            inset: 0;
            background: var(--input-bg);
            border: 1px solid var(--chip-border);
            border-radius: 999px;
            transition: background .2s;
            pointer-events: none;
        }

        .switch-track::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            background: var(--text-muted);
            transition: transform .2s, background .2s;
        }

        .switch input:checked+.switch-track {
            background: var(--accent-gradient);
            border-color: transparent;
        }

        .switch input:checked+.switch-track::after {
            transform: translateX(1.3rem);
            background: #fff;
        }

        /* TOAST */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(150%);
            background: var(--card-bg);
            border: 1px solid var(--chip-border);
            color: var(--text-primary);
            padding: .7rem 1.1rem;
            border-radius: .7rem;
            font-size: var(--label-size);
            z-index: 150;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            transition: transform .3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .hidden {
            display: none !important;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: .375rem;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: .25rem;
        }

        /* RESPEITA "reduzir movimento" do sistema */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

        // ===========================
        // GERAR PALAVRA COM IA (chamada direta à API do Gemini)
        // ===========================
        const GEMINI_MODEL = "gemini-3.6-flash"; // alias sempre apontando pro Flash GA mais atual

        async function gerarPalavraIA(tema) {
            console.group("🤖 [GEMINI] Gerando palavra");

            try {
                const temaTexto = tema && tema.trim()
                    ? tema.trim()
                    : "livre — escolha um tema criativo e divertido pro grupo";

                const evitar = historicoIA.slice(-8);

                const prompt = `Você gera a palavra secreta de uma rodada do jogo social "Impostor" (estilo Spyfall/Just One), jogado por um grupo de amigos brasileiro.

Tema pedido: ${temaTexto}
${evitar.length ? `Não repita nenhuma destas palavras já usadas recentemente: ${evitar.join(", ")}.` : ""}

Regras da resposta:
- Responda APENAS com a palavra ou expressão curta (no máximo 4 palavras), sem aspas, sem explicação e sem pontuação no final.
- Escolha algo específico o bastante pra gerar boa discussão, mas conhecido o suficiente pra um grupo de amigos brasileiro reconhecer.
- Responda em português do Brasil.`;

                const url =
                    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;

                // ============================================================
                // DEBUG DA REQUISIÇÃO
                // ============================================================

                console.log("Modelo:", GEMINI_MODEL);
                console.log("URL:", url);
                console.log("Tema:", temaTexto);
                console.log("Palavras a evitar:", evitar);
                console.log("Prompt:", prompt);

                const requestBody = {
                    contents: [
                        {
                            parts: [
                                {
                                    text: prompt
                                }
                            ]
                        }
                    ],
                    generationConfig: {
                        maxOutputTokens: 40,
                        temperature: 1
                    }
                };

                console.log("Request body:", requestBody);

                // ============================================================
                // FETCH
                // ============================================================

                let response;

                try {
                    console.log("Enviando requisição para Gemini...");

                    /*response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "content-type": "application/json",
                            "x-goog-api-key": apiKey
                        },
                        body: JSON.stringify(requestBody)
                    });*/

                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "x-goog-api-key": apiKey
                            },
                            body: JSON.stringify({
                                contents: [
                                    {
                                        parts: [
                                            {
                                                text: "Responda apenas com uma palavra em português."
                                            }
                                        ]
                                    }
                                ]
                            })
                        }
                    );

                    console.log("Resposta recebida!");
                    console.log("HTTP Status:", response.status);
                    console.log("HTTP OK:", response.ok);
                    console.log("HTTP Status Text:", response.statusText);
                    console.log(
                        "Content-Type:",
                        response.headers.get("content-type")
                    );

                } catch (fetchError) {
                    console.error("❌ ERRO NO FETCH");
                    console.error("Nome:", fetchError?.name);
                    console.error("Mensagem:", fetchError?.message);
                    console.error("Stack:", fetchError?.stack);

                    throw new Error(
                        `Falha de comunicação com o Gemini: ${fetchError?.message || "erro desconhecido"}`
                    );
                }

                // ============================================================
                // LER RESPOSTA BRUTA
                // ============================================================

                let rawResponse;

                try {
                    rawResponse = await response.text();

                    console.log("Resposta bruta do Gemini:");
                    console.log(rawResponse);

                } catch (bodyError) {
                    console.error("❌ ERRO AO LER CORPO DA RESPOSTA");
                    console.error(bodyError);

                    throw new Error(
                        "Não foi possível ler a resposta do Gemini."
                    );
                }

                // ============================================================
                // HTTP ERROR
                // ============================================================

                if (!response.ok) {
                    console.error("❌ GEMINI RETORNOU ERRO HTTP");
                    console.error("Status:", response.status);
                    console.error("Status Text:", response.statusText);
                    console.error("Body:", rawResponse);

                    let mensagem = `Erro HTTP ${response.status}`;

                    try {
                        const errBody = JSON.parse(rawResponse);

                        console.error("Erro JSON parseado:", errBody);

                        if (errBody?.error) {
                            console.error("Código:", errBody.error.code);
                            console.error("Mensagem:", errBody.error.message);
                            console.error("Status:", errBody.error.status);

                            mensagem =
                                errBody.error.message ||
                                mensagem;
                        }

                    } catch (parseError) {
                        console.error(
                            "Resposta de erro não é JSON válido:",
                            parseError
                        );
                    }

                    throw new Error(mensagem);
                }

                // ============================================================
                // PARSE DO JSON
                // ============================================================

                let data;

                try {
                    data = JSON.parse(rawResponse);

                    console.log("JSON parseado:");
                    console.log(data);

                } catch (parseError) {
                    console.error("❌ ERRO AO PARSEAR JSON");
                    console.error("Erro:", parseError);
                    console.error("Resposta recebida:", rawResponse);

                    throw new Error(
                        "O Gemini retornou uma resposta que não é um JSON válido."
                    );
                }

                // ============================================================
                // VERIFICAR ERRO DENTRO DO JSON
                // ============================================================

                if (data?.error) {
                    console.error("❌ API RETORNOU CAMPO ERROR");
                    console.error("Error completo:", data.error);

                    throw new Error(
                        data.error.message ||
                        "Erro retornado pela API do Gemini."
                    );
                }

                // ============================================================
                // PROMPT FEEDBACK / SEGURANÇA
                // ============================================================

                if (data?.promptFeedback) {
                    console.log("Prompt feedback:", data.promptFeedback);

                    if (data.promptFeedback.blockReason) {
                        console.error(
                            "🚫 PROMPT BLOQUEADO:",
                            data.promptFeedback.blockReason
                        );

                        console.error(
                            "Safety ratings:",
                            data.promptFeedback.safetyRatings
                        );

                        throw new Error(
                            `Prompt bloqueado pelo Gemini: ${data.promptFeedback.blockReason}`
                        );
                    }
                }

                // ============================================================
                // CANDIDATE
                // ============================================================

                const candidato = data?.candidates?.[0];

                if (!candidato) {
                    console.error("❌ NENHUM CANDIDATO RETORNADO");
                    console.error("Resposta completa:", data);

                    throw new Error(
                        "Gemini não retornou nenhum candidato."
                    );
                }

                console.log("Candidate completo:");
                console.log(candidato);

                // ============================================================
                // FINISH REASON
                // ============================================================

                console.log(
                    "Finish reason:",
                    candidato.finishReason
                );

                console.log(
                    "Safety ratings:",
                    candidato.safetyRatings
                );

                if (candidato.finishReason !== "STOP") {
                    console.warn(
                        "⚠️ Gemini terminou por um motivo diferente de STOP:",
                        candidato.finishReason
                    );
                }

                // ============================================================
                // CONTENT
                // ============================================================

                console.log(
                    "Content:",
                    candidato.content
                );

                const parts = candidato.content?.parts || [];

                console.log(
                    "Parts:",
                    parts
                );

                // ============================================================
                // EXTRAIR TEXTO
                // ============================================================

                let palavra = parts
                    .map(part => part?.text || "")
                    .join("")
                    .trim();

                console.log(
                    "Texto antes da limpeza:",
                    palavra
                );

                palavra = palavra
                    .replace(/^["'.]+|["'.]+$/g, "")
                    .trim();

                console.log(
                    "Texto depois da limpeza:",
                    palavra
                );

                // ============================================================
                // RESPOSTA VAZIA
                // ============================================================

                if (!palavra) {
                    console.error("❌ RESPOSTA FINAL VAZIA");

                    console.error("Diagnóstico completo:", {
                        candidato,
                        finishReason: candidato.finishReason,
                        safetyRatings: candidato.safetyRatings,
                        promptFeedback: data.promptFeedback,
                        content: candidato.content,
                        parts
                    });

                    throw new Error(
                        `Gemini não retornou texto. Motivo: ${candidato.finishReason || "desconhecido"
                        }`
                    );
                }

                // ============================================================
                // SALVAR HISTÓRICO
                // ============================================================

                historicoIA.push(palavra);

                if (historicoIA.length > 20) {
                    historicoIA = historicoIA.slice(-20);
                }

                localStorage.setItem(
                    "impostorIAHistorico",
                    JSON.stringify(historicoIA)
                );

                console.log("✅ Palavra gerada:", palavra);
                console.log("Histórico atualizado:", historicoIA);

                console.groupEnd();

                return palavra;

            } catch (error) {

                console.error("❌ ERRO FINAL EM gerarPalavraIA");
                console.error("Mensagem:", error?.message);
                console.error("Nome:", error?.name);
                console.error("Stack:", error?.stack);
                console.error("Objeto completo:", error);

                console.groupEnd();

                throw error;
            }
        }

        // ===========================
        // ESCOLHA LOCAL (sem repetir a última, se der)
        // ===========================
        function escolherPalavraLocal(pool) {
            if (!pool.length) return "";
            let escolha = pool[Math.floor(Math.random() * pool.length)];
            if (pool.length > 1) {
                let tentativas = 0;
                while (escolha === ultimaPalavraLocal && tentativas < 10) {
                    escolha = pool[Math.floor(Math.random() * pool.length)];
                    tentativas++;
                }
            }
            ultimaPalavraLocal = escolha;
            localStorage.setItem("impostorUltimaPalavraLocal", escolha);
            return escolha;
        }

        // ===========================

        // ===========================
        function gerarInputsJogadores(nomesSalvos = []) {
            const qtd = parseInt(document.getElementById("numPlayers").value);
            const box = document.getElementById("playerNames");

            if (!qtd || qtd < 1) return;

        // ===========================
        // SALVAR / CARREGAR MEMÓRIA (localStorage)
        // ===========================
        function salvarMemoria(qtd, nomes, categoriasMarcadas, numImpostoresVal, temaIA) {
            localStorage.setItem("jogoImpostor", JSON.stringify({
                qtd,
                nomes,
                categorias: categoriasMarcadas,
                numImpostores: numImpostoresVal,
                temaIA
            }));
        }

        function carregarMemoria() {
            const dados = localStorage.getItem("jogoImpostor");
            if (!dados) {
                return {
                    qtd: 5,
                    nomes: [],
                    categorias: Object.keys(categorias),
                    numImpostores: 1,
                    temaIA: ""
                };
            }

            const parsed = JSON.parse(dados);

            return {
                qtd: parsed.qtd ?? 5,
                nomes: parsed.nomes ?? [],
                categorias: parsed.categorias ?? Object.keys(categorias),
                numImpostores: parsed.numImpostores ?? 1,
                temaIA: parsed.temaIA ?? ""
            };
        }

        // ===========================
        // INICIAR JOGO
        // ===========================
        async function iniciarJogo() {
            totalPlayers = parseInt(document.getElementById("numPlayers").value);
            numImpostores = Number(document.getElementById("numimpostores").value);

            if (isNaN(totalPlayers) || totalPlayers < 3) {
                alert("Mínimo de 3 jogadores!");
                return;
            }

            let selecionadas = [];
            let temaIA = "";

            if (modoIA) {
                if (!apiKey) {
                    alert("Configure sua API key do Gemini em ⚙️ Configurações pra usar o Modo IA (ou desative o Modo IA).");
                    return;
                }
                const temaInput = document.getElementById("temaIA");
                temaIA = temaInput ? temaInput.value.trim() : "";
            } else {
                selecionadas = [...document.querySelectorAll("#categoriaList input:checked")].map(c => c.value);
                if (selecionadas.length === 0) {
                    alert("Selecione pelo menos 1 categoria!");
                    return;
                }
            }

            // Nomes dos jogadores
            let nomes = [];
            for (let i = 1; i <= totalPlayers; i++) {
                let nome = document.getElementById(`playerName${i}`).value.trim();
                if (!nome) nome = "Player " + i;
                nomes.push(nome);
            }

            // SALVAR NA MEMÓRIA
            salvarMemoria(totalPlayers, nomes, selecionadas, numImpostores, temaIA);

            const startBtn = document.getElementById("startBtn");

            if (modoIA) {
                if (startBtn) { startBtn.disabled = true; startBtn.textContent = "Gerando com IA..."; }
                try {
                    palavraEscolhida = await gerarPalavraIA(temaIA);
                } catch (e) {
                    console.error("Falha ao gerar palavra com IA:", e);
                    mostrarAviso("IA indisponível, usando lista local. (" + e.message + ")");
                    palavraEscolhida = escolherPalavraLocal(Object.values(categorias).flat());
                }
                if (startBtn) { startBtn.disabled = false; startBtn.textContent = "Começar"; }
            } else {
                let pool = [];
                selecionadas.forEach(cat => { pool = pool.concat(categorias[cat]); });
                palavraEscolhida = escolherPalavraLocal(pool);
            }

            // Jogadores
            players = nomes.map((nome, i) => ({ id: i + 1, nome, impostor: false }));

            // Sorteio dos impostores SEM repetir o mesmo jogador
            // (bug do original: sorteava com reposição e podia marcar o mesmo player 2x quando numImpostores=2)
            const indicesDisponiveis = players.map((_, i) => i);
            let impostoresRestantes = Math.min(numImpostores, players.length);
            while (impostoresRestantes > 0) {
                impostoresRestantes--;
                const escolha = Math.floor(Math.random() * indicesDisponiveis.length);
                impostorIndex = indicesDisponiveis.splice(escolha, 1)[0];
                players[impostorIndex].impostor = true;
            }

            indexAtual = 0;
            mostrarPlayerTelaSegura();
        }

        // ===========================
        // TELA DE SEGURANÇA
        // ===========================
        function mostrarPlayerTelaSegura() {
            const p = players[indexAtual];

            app.innerHTML = `
        <div class="card">
            <h2>${p.nome}</h2>
            <p>Clique para revelar seu papel.</p>

            <button onclick="revelarPapel()">Revelar</button>
        </div>
    `;
        }

        // ===========================
        // REVELAR PAPEL
        // ===========================
        function revelarPapel() {
            const p = players[indexAtual];

            app.innerHTML = `
        <div class="card">
            <h2>${p.nome}</h2>
            ${p.impostor
                    ? `<p>Você é o <b style="color: var(--accent);">IMPOSTOR</b>.</p>`
                    : `<p>Sua palavra é:<br><br><b>${palavraEscolhida}</b></p>`
                }
            <button onclick="proximoPlayer()">OK, já vi</button>
        </div>
    `;
        }

        // ===========================
        // PRÓXIMO PLAYER
        // ===========================
        function proximoPlayer() {
            indexAtual++;
            if (indexAtual < players.length) {
                mostrarPlayerTelaSegura();
            } else {
                escolherQuemComenca();
            }
        }

        // ===========================
        // QUEM COMEÇA?
        // ===========================
        function escolherQuemComenca() {
            const chanceImpostor = 0.05;
            const chanceProxImpostor = 0.33;
            const r = Math.random();

            if (r < chanceImpostor) {
                primeiroASpeak = impostorIndex;
            } else if (r < chanceImpostor + chanceProxImpostor) {
                // bug do original: quando o impostor era o último da lista, isso estourava o índice
                // (players.length é sempre != a um índice válido) e o app quebrava. Corrigido com wrap-around:
                primeiroASpeak = (impostorIndex + 1) % players.length;
            } else {
                const normais = players.filter(p => !p.impostor);
                const escolha = Math.floor(Math.random() * normais.length);
                primeiroASpeak = players.findIndex(p => p.id === normais[escolha].id);
            }

            telaInicioDiscussao();
        }

        // ===========================
        // TELA FINAL
        // ===========================
        function telaInicioDiscussao() {
            const p = players[primeiroASpeak];

            app.innerHTML = `
        <div class="card">
            <h1>Papéis revelados!</h1>
            <p>Quem começa falando:</p>

            <h2 style=" margin-top:20px;">
                ${p.nome}
            </h2>

            <button onclick="telaInicial()">Jogar de novo</button>
        </div>
    `;
        }

        // ===========================
        // INÍCIO
        // ===========================
        aplicarTema(theme);
        telaInicial();
    </script>

</body>

</html>
